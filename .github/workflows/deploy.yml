name: AccessHub Frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      target:
        description: Select which service to restart
        required: true
        default: both
        type: choice
        options:
          - backend
          - frontend
          - both
      working_dir:
        description: Remote working directory
        required: true
        default: /var/www/fullstack
        type: string
      compose_file:
        description: Compose file path relative to working_dir
        required: true
        default: docker-compose.yml
        type: string

concurrency:
  group: accesshub-frontend
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

  deploy-frontend:
    name: Deploy Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL || '' }}
          REACT_APP_ENV: production
        run: |
          npm i
          npm run build || true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Deploy to S3 (+ optional CloudFront invalidate)
        run: |
          aws s3 sync frontend/build "s3://${{ secrets.FRONTEND_S3_BUCKET }}/" --delete --region ap-south-1
          if [[ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]]; then
            aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" --region ap-south-1
          fi

  restart-services:
    name: Restart Services
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ inputs.working_dir }}"
            TARGET="${{ inputs.target }}"
            CF="${{ inputs.compose_file }}"
            if [ "$TARGET" = "backend" ]; then
              SERVICES="backend"
            elif [ "$TARGET" = "frontend" ]; then
              SERVICES="frontend"
            else
              SERVICES="backend frontend"
            fi
            docker compose -f "$CF" ps
            docker compose -f "$CF" restart $SERVICES
