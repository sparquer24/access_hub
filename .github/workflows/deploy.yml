name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      target:
        description: Select which service to restart
        required: true
        default: both
        type: choice
        options:
          - backend
          - frontend
          - both
      working_dir:
        description: Remote working directory
        required: true
        default: /var/www/fullstack
        type: string
      compose_file:
        description: Compose file path relative to working_dir
        required: true
        default: docker-compose.yml
        type: string

concurrency:
  group: fullstack-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            other:
              - '**'
              - '!backend/**'
              - '!frontend/**'

  # Backend deployment handled by deploy-backend.yml to avoid double triggers

  deploy-frontend:
    name: Deploy Frontend
    needs: changes
    if: needs.changes.outputs.other == 'false' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        env:
          WORKDIR: frontend
          BUILD_CMD: npm run build
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL || '' }}
          REACT_APP_ENV: production
        run: bash .github/scripts/build-frontend.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Deploy to S3 (+ optional CloudFront invalidate)
        env:
          AWS_REGION: ap-south-1
          S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
          SOURCE_DIR: frontend/build
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash .github/scripts/deploy-frontend-s3.sh

  restart-services:
    name: Restart Services
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ inputs.working_dir }}"
            TARGET="${{ inputs.target }}"
            CF="${{ inputs.compose_file }}"
            if [ "$TARGET" = "backend" ]; then
              SERVICES="backend"
            elif [ "$TARGET" = "frontend" ]; then
              SERVICES="frontend"
            else
              SERVICES="backend frontend"
            fi
            docker compose -f "$CF" ps
            docker compose -f "$CF" restart $SERVICES
