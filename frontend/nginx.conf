server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Send everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/202-53-72-149.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/202-53-72-149.sslip.io/privkey.pem;

    # Proxy API calls to the backend over the internal docker network so the
    # browser only ever talks to this single HTTPS origin (avoids mixed-content
    # blocking, since the backend itself is plain HTTP on :5001).
    location /api/ {
        proxy_pass http://fullstack-backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO real-time alerts (needs the Upgrade/Connection headers for websockets)
    location /socket.io/ {
        proxy_pass http://fullstack-backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This routes all unknown requests to index.html for React/Vue SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
